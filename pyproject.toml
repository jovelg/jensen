[project]
name = "newsflow"
version = "0.1.0"
description = "Cross-venue taker tapes around news: Hyperliquid, Kalshi, Polymarket"
requires-python = ">=3.11"
dependencies = ["matplotlib", "pandas"]

[dependency-groups]
dev = ["jupyter", "nbconvert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsflow"]
